name: Build & GitHub Release on tag (uv)

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build-bump-release:
    # Prevent an infinite loop when the workflow force-updates the tag.
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest
          enable-cache: true

      - name: "Bump version, commit, and push (author: GitHub Actions bot)"
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # We start checked out at the tag; fetch and switch to the default branch
          git fetch origin "$DEFAULT_BRANCH":"$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"

          # Bump version to match the tag name (whatever it is)
          uv version "$TAG"

          # Commit only if something changed
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "chore: Bump version to $TAG"
            git push origin "$DEFAULT_BRANCH"
          else
            echo "No changes after 'uv version $TAG' (nothing to commit)."
          fi

          # Move the tag to this commit so the release/tag matches the bumped-version commit
          git tag -f "$TAG"
          git push origin -f "refs/tags/$TAG"

      - name: Build (sdist + wheel)
        run: uv build

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
